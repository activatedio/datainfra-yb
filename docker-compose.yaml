services:
  yugabyte:
    image: yugabytedb/yugabyte:latest
    command: bin/yugabyted start --background=false
    ports:
    - 5433:5433
    - 15433:15433
    healthcheck:
      test: ["CMD-SHELL", "postgres/bin/pg_isready -h $(hostname) -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 12
